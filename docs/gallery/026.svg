" font-size="78" fill="#141414" text-anchor="start" font-weight="700"></text><g opacity="0.04130931839624652"><text x="-430" y="-100" font-size="35" fill="#141414" text-anchor="start" font-weight="700">从整体看见方向。</text><g transform="translate(220 40) rotate(0) scale(0.68)"><g><circle r="180" fill="#0070DB"></circle><circle cx="60" cy="-55" r="130" fill="#fff"></circle><path d="M-150 210H160" stroke="#0070DB" stroke-width="7"></path></g></g></g></g><g opacity="0.9586906816037535" transform="translate(-210.91194995282578 0)"><text x="-400" y="-75" font-size="24" fill="#0070DB" text-anchor="start" font-weight="700">进入重点 / CONTEXT</text><text x="-400" y="20" font-size="60" fill="#141414" text-anchor="start" font-weight="700">让细节，变得可读。</text><text x="-400" y="100" font-size="28" fill="#141414" text-anchor="start" font-weight="400">不是只放大像素，而是进入下一层。</text></g></g><text x="90" y="125" font-size="33" fill="#141414" text-anchor="start" font-weight="700">从全景，进入细节。</text><text x="1518" y="855" fill="#8a8f96" font-size="17" font-weight="400" text-anchor="end">MOTION STUDY / INTERFLOW</text></svg>